<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Detection System</title>
  <style>
    :root {
      --primary: #00ff88;
      --dark-bg: #0a0e17;
      --card-bg: #131a2a;
      --text-primary: #ffffff;
      --text-secondary: #888888;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: var(--dark-bg);
      color: var(--text-primary);
      line-height: 1.5;
      padding: 16px;
      min-height: 100vh;
    }

    #status {
      text-align: center;
      padding: 16px;
      font-weight: bold;
      border-radius: 12px;
      background: rgba(0, 255, 136, 0.1);
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      border: 1px solid var(--primary);
      margin-bottom: 24px;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(0, 255, 136, 0.1);
    }

    #dashboard {
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 800px;
      margin: 0 auto;
    }

    .canvas-container {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      overflow: hidden;
    }

    h2 {
      font-size: 14px;
      margin-bottom: 16px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    canvas {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
      background-color: #0c1120;
      border: 1px solid rgba(255, 255, 255, 0.05);
      max-width: 100%;
    }

    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--primary);
      margin-right: 10px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }

    .debug-info {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Video element should be hidden but accessible */
    #video {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
    }

    #face-3d {
      display: none;
    }
  </style>
</head>
<body>

  <div id="status">
    <span class="status-indicator"></span>
    INITIALIZING FACE DETECTION...
  </div>

  <div id="dashboard">
    <div class="canvas-container">
      <h2>Live Analysis Feed</h2>
      <canvas id="canvas"></canvas>
      <div class="debug-info">
        Canvas Status: <span id="canvas-status">Waiting for video...</span>
      </div>
    </div>

    <div class="canvas-container">
      <h2>Biometric Extraction</h2>
      <canvas id="faceMaskedCanvas"></canvas>
      <div class="debug-info">
        Face Detection: <span id="detection-status">No face detected</span>
      </div>
    </div>
  </div>

  <!-- Video element for camera stream -->
  <video id="video" autoplay playsinline></video>
  <div id="face-3d"></div>
